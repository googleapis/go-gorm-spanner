on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
name: PostgreSQL-dialect tests
permissions:
  contents: read
jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    services:
      emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:latest # zizmor: ignore[unpinned-images]
        ports:
          - 9010:9010
          - 9020:9020
    steps:
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout gorm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: go-gorm/gorm
          path: postgresql/tests/gorm
          persist-credentials: false
      - name: Run gorm PostgreSQL tests on Emulator
        working-directory: postgresql/tests
        run: ./run_gorm_tests.sh
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
